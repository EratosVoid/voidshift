# Append to ~/.codex/config.toml (Codex ignores otel keys in a repo's .codex/config.toml).
# Tested with codex-cli 0.160.0: keep the exporter on one line.
[otel]
environment = "tether"
log_user_prompt = true
exporter = { otlp-http = { endpoint = "https://INGEST_HOST/v1/logs", protocol = "json", headers = { "Authorization" = "Bearer INGEST_TOKEN", "X-Vsf-Source" = "codex" } } }
